# Render blueprint: the hosted replay, bench, study and live lab. No secrets, no PayPal calls.
services:
  - type: web
    name: black-box
    runtime: node
    plan: free
    buildCommand: npm test
    startCommand: node lab/hosted.mjs
    healthCheckPath: /bench
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: HOST
        value: 0.0.0.0
