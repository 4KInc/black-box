# Keeps the hosted lab (Render free tier) awake, so a visitor never waits for a cold start.
# Render puts a free service to sleep after about 15 minutes without requests. Does nothing
# until the repository variable LAB_URL is set. A paid instance does not sleep and needs none of this.
name: keep lab warm
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    if: ${{ vars.LAB_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -o /dev/null -w "%{http_code} in %{time_total}s\n" --retry 3 --retry-delay 20 --max-time 90 "$LAB_URL/lab"
        env:
          LAB_URL: ${{ vars.LAB_URL }}
